[project]
name = "nutriguard"
version = "0.1.0"
description = "NutriGuard AI - Vision, Nutrition & Data slice (Person 2, Gate A)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "strands-agents>=1.54,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<6",
    "moto[dynamodb,s3]>=5.0,<6",
    "boto3>=1.35,<2",
    "mypy>=1.11,<2",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
